name: Connected
description: Connected (Connected HQ, Inc.) was a social CRM and contact-management startup
  that pulled a user's address book, email and social accounts together into a single
  continuously-updated relationship manager. Backed by 500 Global, it was acquired by LinkedIn
  in October 2011 and folded into the LinkedIn-branded "Connected" product, after which the
  standalone service was retired. Connected never shipped a public developer program, API,
  SDK or documentation. The connectedhq.com domain is still defensively held by the acquirer
  (MarkMonitor registrar, Azure DNS and NS1 nameservers, SPF and DMARC p=reject, RFC 7505
  null MX) but publishes no A record and serves no content. This profile is retained as a
  historical record; there is no API surface to enrich.
